/** BROWSER SCRIPTS
 * Load custom privileged browser-context scripts from chrome/scripts.
 * .sys.mjs scripts are imported once into the module global.
 * .uc.js scripts are injected into every browser window.
 * This needs general.config.sandbox_enabled=false, which is installed by
 * system/scripts/10config.mjs.
 */
(() => {
	if (typeof Services === "undefined" || typeof Components === "undefined" || typeof Ci === "undefined" || typeof Cu === "undefined" || typeof ChromeUtils === "undefined")
		return;
	try {
		const chromeDir = Services.dirsvc.get("UChrm", Ci.nsIFile);
		const scriptsDir = chromeDir.clone();
		scriptsDir.append("scripts");
		if (!scriptsDir.exists() || !scriptsDir.isDirectory())
			return;

		const manifest = scriptsDir.clone();
		manifest.append("chrome.manifest");
		if (manifest.exists())
			Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

		const backgroundScripts = [];
		const windowScripts = [];
		const entries = scriptsDir.directoryEntries;
		while (entries.hasMoreElements()) {
			const file = entries.getNext().QueryInterface(Ci.nsIFile);
			if (!file.isFile())
				continue;
			const name = file.leafName;
			if (name.startsWith("_"))
				continue;
			if (name.endsWith(".sys.mjs"))
				backgroundScripts.push(name);
			else if (name.endsWith(".uc.js"))
				windowScripts.push(name);
		}

		for (const name of backgroundScripts.toSorted()) {
			try {
				ChromeUtils.importESModule(`chrome://dotfiles/content/${encodeURIComponent(name)}`);
			} catch (e) {
				Cu.reportError(e);
			}
		}

		if (windowScripts.length === 0)
			return;

		const injected = new WeakSet();
		const inject = (window) => {
			if (injected.has(window))
				return;
			injected.add(window);
			for (const name of windowScripts.toSorted()) {
				try {
					Services.scriptloader.loadSubScript(`chrome://dotfiles/content/${encodeURIComponent(name)}`, window);
				} catch (e) {
					Cu.reportError(e);
				}
			}
		};

		Services.obs.addObserver((subject) => {
			try {
				if (subject.document.documentElement.getAttribute("windowtype") === "navigator:browser")
					inject(subject);
			} catch (e) {
				Cu.reportError(e);
			}
		}, "browser-delayed-startup-finished");

		const windows = Services.wm.getEnumerator("navigator:browser");
		while (windows.hasMoreElements())
			inject(windows.getNext());
	} catch (e) {
		Cu.reportError(e);
	}
})();
